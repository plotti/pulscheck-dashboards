server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Evidence-Seiten sind Verzeichnis-Routen: /subscription_health
    # -> /subscription_health/index.html
    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    # Gehashte SvelteKit-Assets: unveränderlich, gross cachen
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Parquet-Daten liest duckdb-wasm per Range-Requests im Browser;
    # nginx liefert die von sich aus. Kurz cachen, damit Updates zeitig kommen.
    location /data/ {
        add_header Cache-Control "public, max-age=300";
    }
}
