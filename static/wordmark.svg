<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 40" role="img" aria-label="PulsCheck">
  <!-- PulsCheck Wordmark – funktionert auf hellem und dunklem Grund (Chip-Design) -->
  <defs>
    <linearGradient id="pc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="156" height="40" rx="9" fill="url(#pc-bg)"/>
  <!-- EKG-Puls -->
  <path d="M10 20 L16 20 L19 12 L24 29 L28 6 L32 20 L37 20"
        fill="none" stroke="#ffffff" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="45" y="27.5"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="700" letter-spacing="-0.3"
        fill="#ffffff">PulsCheck</text>
</svg>
